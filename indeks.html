<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Sayangku</title>
    <!-- Tailwind CSS untuk styling cepat dan responsif -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Sacramento&display=swap');

        body {
            background-color: #e0f2fe; /* Biru muda yang menenangkan */
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            margin: 0;
        }

        .cursive {
            font-family: 'Sacramento', cursive;
        }

        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        .tulip-svg {
            width: 120px;
            height: auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 2px solid white;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* State untuk transisi game */
        .hidden-content {
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            pointer-events: none;
            display: none;
        }

        .visible-content {
            opacity: 1;
            transform: scale(1) translateY(0);
            display: block;
        }

        .game-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            transition: opacity 0.5s ease;
        }

        /* Animasi tombol berdenyut */
        .btn-pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(244, 63, 94, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- HALAMAN GAME (Awal) -->
    <div id="gameScreen" class="game-screen text-center z-20">
        <div class="floating mb-8">
            <!-- Icon Amplop / Hadiah -->
            <svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                <polyline points="3 7 12 13 21 7"></polyline>
            </svg>
        </div>
        <h2 class="text-2xl font-bold text-blue-800 mb-6">Ada sesuatu untukmu...</h2>
        <button onclick="openMessage()" class="btn-pulse bg-rose-500 text-white px-8 py-3 rounded-full font-bold text-lg hover:bg-rose-600 transition-colors shadow-lg">
            Klik untuk Buka ❤️
        </button>
    </div>

    <!-- KONTEN UTAMA (Muncul setelah di-klik) -->
    <div id="mainCard" class="hidden-content card max-w-lg w-full rounded-3xl p-10 shadow-2xl text-center relative overflow-hidden z-10">
        
        <!-- Hiasan Tulip Kartun (SVG) -->
        <div class="flex justify-center mb-8 floating">
            <svg class="tulip-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 95 L50 60" stroke="#4ade80" stroke-width="4" fill="none" />
                <path d="M50 80 Q30 75 25 60 Q35 70 50 75" fill="#4ade80" />
                <path d="M50 85 Q70 80 75 65 Q65 75 50 80" fill="#4ade80" />
                <path d="M50 60 C30 60 25 40 35 25 C40 40 50 45 50 60" fill="#fb7185" />
                <path d="M50 60 C70 60 75 40 65 25 C60 40 50 45 50 60" fill="#f43f5e" />
                <path d="M50 60 C40 55 40 30 50 15 C60 30 60 55 50 60" fill="#fb7185" />
            </svg>
        </div>

        <!-- Teks Romantis -->
        <h1 id="typingText" class="text-xl md:text-2xl font-semibold text-blue-800 mb-8 leading-relaxed">
            <!-- Teks akan muncul di sini -->
        </h1>

        <p class="cursive text-5xl text-pink-600 mt-6">- Y</p>

    </div>

    <!-- Dekorasi Latar Belakang (Hati Melayang) -->
    <div class="fixed top-10 left-10 opacity-20 floating" style="animation-delay: 1s;">
        <svg width="50" height="50" fill="#f43f5e" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </div>
    <div class="fixed bottom-10 right-10 opacity-20 floating" style="animation-delay: 0.5s;">
        <svg width="80" height="80" fill="#f43f5e" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </div>

    <script>
        const fullText = "halo sayanggg, aku happy banget bisa mengenal kamu, bisa sama kamu sampai sejauh ini, terimakasih banyak yaa sayang atas segala hal yang sudah kamu kasih untuk aku. Aku cinta kamu dengan segala kekurangan kamu, walaupun menurut ku kamu tidak punya kekurangan. I love u bey, always.";
        let index = 0;

        function typeWriter() {
            if (index < fullText.length) {
                document.getElementById("typingText").innerHTML += fullText.charAt(index);
                index++;
                setTimeout(typeWriter, 50); // Kecepatan mengetik
            }
        }

        function openMessage() {
            // Sembunyikan layar game
            const gameScreen = document.getElementById('gameScreen');
            gameScreen.style.opacity = '0';
            
            setTimeout(() => {
                gameScreen.style.display = 'none';
                
                // Munculkan kartu utama
                const mainCard = document.getElementById('mainCard');
                mainCard.style.display = 'block';
                
                // Trigger animasi masuk
                setTimeout(() => {
                    mainCard.classList.remove('hidden-content');
                    mainCard.classList.add('visible-content');
                    // Mulai efek mengetik
                    typeWriter();
                }, 100);
            }, 500);
        }
    </script>
</body>
</html>
